server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 301 Permanent Redirect: /index.html -> /
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }

    # 301 Permanent Redirect: any-page.html -> /any-page
    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # Clean URLs: try file as-is, as directory, as .html file, or fallback to index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Health check for Dokploy / Traefik
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
